<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheer Trivia Quiz Game</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .quiz-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 80%;
            max-width: 600px;
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .question {
            font-size: 1.5em;
            margin-bottom: 20px;
        }
        .options {
            list-style-type: none;
            padding: 0;
        }
        .options li {
            margin: 10px 0;
        }
        .options button {
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007BFF;
            color: #fff;
            transition: background-color 0.3s;
        }
        .options button:hover {
            background-color: #0056b3;
        }
        .result {
            font-size: 1.2em;
            margin-top: 20px;
        }
        .progress-bar {
            height: 20px;
            background-color: #007BFF;
            border-radius: 10px;
            margin-bottom: 20px;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="progress-bar" id="progress-bar"></div>
        <div class="question" id="question">Loading...</div>
        <ul class="options" id="options"></ul>
        <div class="result" id="result"></div>
    </div>

    <script>
        const questions = [
            {
                question: "What is the name of the cheerleading stunt where one person is lifted into the air by another?",
                options: ["Liberty", "Basket Toss", "Pyramid", "Cradle"],
                answer: "Liberty"
            },
            {
                question: "Which cheerleading move involves flipping backwards and landing on your feet?",
                options: ["Back Handspring", "Toe Touch", "Herkie", "Pike"],
                answer: "Back Handspring"
            },
            {
                question: "What is the term for a cheerleading routine performed at a competition?",
                options: ["Cheer", "Dance", "Routine", "Performance"],
                answer: "Routine"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        function loadQuestion() {
            const questionElement = document.getElementById('question');
            const optionsElement = document.getElementById('options');
            const resultElement = document.getElementById('result');
            const progressBar = document.getElementById('progress-bar');

            if (currentQuestionIndex < questions.length) {
                const currentQuestion = questions[currentQuestionIndex];
                questionElement.textContent = currentQuestion.question;
                optionsElement.innerHTML = '';
                currentQuestion.options.forEach(option => {
                    const li = document.createElement('li');
                    const button = document.createElement('button');
                    button.textContent = option;
                    button.onclick = () => checkAnswer(option);
                    li.appendChild(button);
                    optionsElement.appendChild(li);
                });
                resultElement.textContent = '';
                progressBar.style.width = `${(currentQuestionIndex / questions.length) * 100}%`;
            } else {
                questionElement.textContent = 'Quiz Completed!';
                optionsElement.innerHTML = '';
                resultElement.textContent = `Your score: ${score}/${questions.length}`;
                progressBar.style.width = '100%';
            }
        }

        function checkAnswer(selectedOption) {
            const currentQuestion = questions[currentQuestionIndex];
            if (selectedOption === currentQuestion.answer) {
                score++;
            }
            currentQuestionIndex++;
            loadQuestion();
        }

        loadQuestion();
    </script>
</body>
</html>
